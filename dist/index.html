<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101821" />
    <meta name="description" content="大家一起維護的台灣夜市地圖，探索攤位、評分美食、分享口袋名單。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ee583e'/%3E%3Cpath d='M16 26 32 14l16 12v23H16z' fill='%23fff8ea'/%3E%3Ccircle cx='32' cy='37' r='6' fill='%23ee583e'/%3E%3C/svg%3E" />
    <title>夜市地圖｜一起找好吃的</title>
    <style>
      :root {
        --ink: #101821;
        --ink-2: #1c2732;
        --ink-3: #293744;
        --paper: #fff8ea;
        --paper-2: #f8efdf;
        --line: rgba(16, 24, 33, 0.12);
        --muted: #6d7880;
        --hot: #ee583e;
        --hot-dark: #c53d31;
        --sun: #f2c15b;
        --map: #d6e4df;
        --map-2: #e9f0e9;
        --blue: #4d7f9c;
        --shadow: 0 16px 45px rgba(13, 23, 29, 0.13);
        --radius: 20px;
      }

      * { box-sizing: border-box; }
      html { min-width: 320px; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(242, 193, 91, 0.78); outline-offset: 2px; }

      .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
      .topbar {
        height: 78px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 34px;
        color: var(--paper);
        background: var(--ink);
        border-bottom: 1px solid rgba(255, 248, 234, .1);
        position: relative;
        z-index: 20;
      }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 184px; }
      .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; color: var(--paper); background: var(--hot); border-radius: 12px 12px 12px 5px; box-shadow: 4px 4px 0 rgba(242,193,91,.95); }
      .brand-mark svg { width: 20px; height: 20px; }
      .brand-text { display: grid; gap: 0; line-height: 1.1; }
      .brand-text strong { font-size: 17px; letter-spacing: .06em; }
      .brand-text span { color: #aeb8bd; font-size: 11px; letter-spacing: .13em; margin-top: 4px; }
      .search-wrap { width: min(530px, 42vw); position: relative; }
      .search-wrap svg { width: 19px; height: 19px; position: absolute; left: 17px; top: 14px; color: #93a2aa; }
      .search-wrap input { width: 100%; height: 47px; padding: 0 18px 0 49px; color: var(--paper); background: var(--ink-2); border: 1px solid #33434f; border-radius: 14px; transition: .2s ease; }
      .search-wrap input::placeholder { color: #9eabb0; }
      .search-wrap input:focus { border-color: var(--sun); background: #24313d; }
      .top-actions { margin-left: auto; display: flex; align-items: center; gap: 13px; }
      .icon-btn, .avatar-btn { border: 0; color: #d9e0df; background: transparent; display: grid; place-items: center; }
      .icon-btn { width: 40px; height: 40px; border-radius: 11px; }
      .icon-btn:hover { color: var(--paper); background: var(--ink-3); }
      .avatar-btn { width: 39px; height: 39px; border-radius: 50%; background: #f2c15b; color: #543c13; font-weight: 800; font-size: 13px; border: 2px solid rgba(255,248,234,.5); }
      .top-actions svg { width: 20px; height: 20px; }
      .primary-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; color: #fff8ea; background: var(--hot); border: 0; border-radius: 12px; font-weight: 750; box-shadow: 0 5px 0 var(--hot-dark); transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
      .primary-btn:hover { background: #f3674f; transform: translateY(-1px); box-shadow: 0 6px 0 var(--hot-dark); }
      .primary-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--hot-dark); }
      .primary-btn svg { width: 17px; height: 17px; }

      .workspace { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(330px, 390px) minmax(0, 1fr); }
      .sidebar { min-height: calc(100vh - 78px); background: var(--paper); border-right: 1px solid var(--line); overflow: auto; position: relative; z-index: 5; }
      .sidebar-inner { padding: 25px 24px 32px; }
      .eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--hot); font-size: 12px; font-weight: 800; letter-spacing: .1em; }
      .eyebrow::before { content: ""; width: 7px; height: 7px; background: var(--hot); border-radius: 50%; box-shadow: 0 0 0 4px rgba(238,88,62,.13); }
      .sidebar h1 { margin: 10px 0 0; font-size: 27px; line-height: 1.25; letter-spacing: -.04em; }
      .sidebar-intro { margin: 8px 0 20px; color: var(--muted); font-size: 14px; }
      .area-switch { display: flex; padding: 4px; background: var(--paper-2); border-radius: 12px; margin-bottom: 21px; }
      .area-switch button { flex: 1; height: 34px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; font-size: 13px; }
      .area-switch button.active { color: var(--ink); background: #fffdf7; box-shadow: 0 2px 6px rgba(16,24,33,.08); font-weight: 800; }
      .filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
      .filters::-webkit-scrollbar { display: none; }
      .filter-chip { flex: 0 0 auto; height: 34px; padding: 0 12px; border: 1px solid var(--line); color: #59656c; background: rgba(255,255,255,.45); border-radius: 99px; font-size: 13px; white-space: nowrap; }
      .filter-chip:hover { border-color: var(--hot); color: var(--hot-dark); }
      .filter-chip.active { color: #fff; background: var(--ink); border-color: var(--ink); }
      .list-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 0 11px; }
      .list-heading h2 { margin: 0; font-size: 15px; letter-spacing: .02em; }
      .list-heading span { color: var(--muted); font-size: 12px; }
      .stall-list { display: grid; gap: 11px; }
      .stall-card { display: grid; grid-template-columns: 61px 1fr auto; gap: 12px; align-items: center; padding: 11px; text-align: left; width: 100%; border: 1px solid transparent; border-radius: 16px; color: var(--ink); background: rgba(255,255,255,.47); transition: .2s ease; }
      .stall-card:hover, .stall-card.selected { border-color: rgba(238,88,62,.35); background: #fffdf8; box-shadow: 0 7px 20px rgba(17,30,32,.07); transform: translateY(-1px); }
      .stall-thumb { width: 61px; height: 61px; display: grid; place-items: center; font-size: 27px; background: var(--thumb, #f8e0b3); border-radius: 14px; position: relative; }
      .stall-thumb .live { width: 8px; height: 8px; position: absolute; right: 5px; top: 5px; background: #3b9a65; border: 2px solid var(--paper); border-radius: 50%; }
      .stall-meta { min-width: 0; }
      .stall-name { display: block; overflow: hidden; font-size: 14px; font-weight: 800; white-space: nowrap; text-overflow: ellipsis; }
      .stall-kind { display: block; color: var(--muted); font-size: 12px; margin: 3px 0 5px; }
      .rating-row { display: flex; align-items: center; gap: 5px; font-size: 12px; }
      .stars { color: #e8a62f; letter-spacing: -2px; font-size: 14px; }
      .rating-value { font-weight: 800; }
      .review-count { color: var(--muted); }
      .bookmark { width: 28px; height: 30px; display: grid; place-items: center; border: 0; color: #9aa3a4; background: transparent; border-radius: 8px; }
      .bookmark:hover, .bookmark.saved { color: var(--hot); background: #fff0ea; }
      .bookmark svg { width: 17px; height: 17px; }
      .empty-state { padding: 28px 18px; border: 1px dashed rgba(16,24,33,.2); border-radius: 16px; text-align: center; color: var(--muted); background: rgba(255,255,255,.32); }
      .empty-state strong { display: block; color: var(--ink); margin-bottom: 5px; }

      .map-stage { position: relative; min-height: calc(100vh - 78px); overflow: hidden; background: var(--map); }
      .map-canvas { position: absolute; inset: 0; overflow: hidden; background: var(--map-2); }
      .map-canvas::before { content: ""; position: absolute; inset: -15%; opacity: .7; background-image: linear-gradient(31deg, transparent 0 47%, rgba(255,255,255,.92) 48% 51%, transparent 52%), linear-gradient(119deg, transparent 0 48%, rgba(255,255,255,.7) 49% 51%, transparent 52%), linear-gradient(90deg, transparent 0 72%, rgba(184,208,199,.34) 72.2% 73.4%, transparent 73.6%); background-size: 185px 160px, 220px 190px, 390px 100%; transform: rotate(-9deg) scale(1.12); }
      .map-canvas::after { content: ""; position: absolute; inset: 0; opacity: .65; background: radial-gradient(ellipse at 16% 36%, rgba(119,170,153,.45) 0 12%, transparent 12.2%), radial-gradient(ellipse at 83% 18%, rgba(186,213,195,.6) 0 10%, transparent 10.2%), radial-gradient(ellipse at 52% 88%, rgba(121,172,157,.27) 0 17%, transparent 17.2%); pointer-events: none; }
      .map-road { position: absolute; height: 8px; border-radius: 99px; background: rgba(255,255,255,.92); box-shadow: 0 0 0 1px rgba(177,198,190,.35); z-index: 1; }
      .road-a { width: 78%; left: 2%; top: 35%; transform: rotate(-15deg); }
      .road-b { width: 74%; left: 19%; top: 60%; transform: rotate(11deg); }
      .road-c { width: 66%; left: 17%; top: 49%; transform: rotate(80deg); }
      .road-d { width: 48%; left: 45%; top: 28%; transform: rotate(29deg); }
      .road-e { width: 43%; left: -3%; top: 74%; transform: rotate(-41deg); }
      .street-label { position: absolute; z-index: 2; color: rgba(61,93,88,.6); font-size: 11px; letter-spacing: .1em; font-weight: 700; transform: rotate(-15deg); }
      .street-1 { left: 20%; top: 28%; }
      .street-2 { right: 16%; top: 60%; transform: rotate(11deg); }
      .street-3 { left: 49%; top: 24%; transform: rotate(80deg); }
      .market-area { position: absolute; z-index: 1; left: 22%; top: 25%; width: 44%; height: 42%; border: 2px dashed rgba(238,88,62,.4); background: rgba(255,248,234,.22); border-radius: 28px; transform: rotate(-7deg); }
      .market-label { position: absolute; left: 27%; top: 29%; z-index: 2; color: #b74a39; font-size: 13px; font-weight: 800; letter-spacing: .12em; transform: rotate(-7deg); }
      .map-controls { position: absolute; right: 27px; top: 27px; display: grid; gap: 9px; z-index: 5; }
      .map-control { width: 42px; height: 42px; display: grid; place-items: center; border: 0; color: var(--ink); background: rgba(255,248,234,.96); border-radius: 12px; box-shadow: 0 8px 20px rgba(34,53,53,.12); }
      .map-control:hover { color: var(--hot); transform: translateY(-1px); }
      .map-control svg { width: 19px; height: 19px; }
      .map-legend { position: absolute; left: 27px; bottom: 24px; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 10px 13px; color: #4c635f; font-size: 12px; background: rgba(255,248,234,.93); border-radius: 11px; box-shadow: 0 8px 20px rgba(34,53,53,.1); }
      .legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      .legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 3px rgba(238,88,62,.2); }
      .legend-dot.blue { background: var(--blue); box-shadow: 0 0 0 3px rgba(77,127,156,.2); }
      .map-pin { position: absolute; z-index: 6; display: grid; place-items: center; width: 38px; height: 38px; color: #fff; background: var(--pin, var(--hot)); border: 3px solid #fffaf0; border-radius: 50% 50% 50% 5px; box-shadow: 0 7px 10px rgba(45,61,60,.2); transform: rotate(-45deg); transition: .2s ease; }
      .map-pin span { font-size: 17px; transform: rotate(45deg); }
      .map-pin:hover, .map-pin.active { transform: rotate(-45deg) scale(1.16); z-index: 9; box-shadow: 0 10px 17px rgba(45,61,60,.27); }
      .pin-1 { left: 38%; top: 36%; }
      .pin-2 { left: 53%; top: 45%; --pin: #e29d2e; }
      .pin-3 { left: 30%; top: 54%; --pin: #4d7f9c; }
      .pin-4 { left: 62%; top: 56%; --pin: #e29d2e; }
      .pin-5 { left: 47%; top: 67%; --pin: #4d7f9c; }
      .pin-6 { left: 71%; top: 37%; --pin: #e29d2e; }
      .user-location { position: absolute; left: 69%; top: 67%; z-index: 4; width: 17px; height: 17px; background: #4d7f9c; border: 4px solid #fff; border-radius: 50%; box-shadow: 0 0 0 9px rgba(77,127,156,.2), 0 5px 10px rgba(45,61,60,.18); }
      .user-location::after { content: "你在這裡"; position: absolute; top: 23px; left: -21px; width: max-content; color: #456875; font-size: 11px; font-weight: 700; }
      .map-callout { position: absolute; z-index: 10; width: 270px; left: 50%; top: 32%; transform: translate(-50%, -100%); padding: 12px 14px; display: none; align-items: center; gap: 10px; color: var(--ink); background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); }
      .map-callout.show { display: flex; animation: pop .18s ease-out; }
      .map-callout::after { content: ""; position: absolute; bottom: -7px; left: calc(50% - 7px); width: 14px; height: 14px; background: var(--paper); transform: rotate(45deg); }
      .callout-emoji { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; background: var(--paper-2); border-radius: 11px; font-size: 22px; }
      .callout-copy { min-width: 0; position: relative; z-index: 1; }
      .callout-copy strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .callout-copy small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
      .callout-close { margin-left: auto; position: relative; z-index: 1; border: 0; color: #899493; background: transparent; }
      @keyframes pop { from { opacity: 0; transform: translate(-50%, -95%) scale(.97); } to { opacity: 1; transform: translate(-50%, -100%) scale(1); } }

      .map-summary { position: absolute; left: 27px; top: 27px; z-index: 5; max-width: 320px; padding: 17px 19px; background: rgba(16,24,33,.92); color: var(--paper); border-radius: 16px; box-shadow: 0 12px 28px rgba(25,47,48,.19); }
      .map-summary .summary-kicker { color: #f2c15b; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
      .map-summary h2 { margin: 4px 0 3px; font-size: 22px; line-height: 1.2; letter-spacing: -.04em; }
      .map-summary p { margin: 0; color: #b3c0c2; font-size: 13px; }

      .featured { margin-top: 23px; overflow: hidden; color: var(--paper); background: var(--ink); border-radius: 17px; box-shadow: 0 9px 24px rgba(16,24,33,.18); }
      .featured img { display: block; width: 100%; height: 105px; object-fit: cover; object-position: 63% 53%; opacity: .83; }
      .featured-content { padding: 13px 14px 15px; position: relative; }
      .featured-label { color: var(--sun); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
      .featured-content strong { display: block; margin-top: 3px; font-size: 16px; }
      .featured-content p { margin: 3px 0 10px; color: #b5c0c2; font-size: 12px; }
      .featured-link { padding: 0; color: var(--paper); border: 0; background: transparent; font-size: 12px; font-weight: 800; }
      .featured-link:hover { color: var(--sun); }
      .featured-arrow { margin-left: 5px; }

      .modal-backdrop { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(16,24,33,.58); backdrop-filter: blur(5px); }
      .modal-backdrop.open { display: flex; animation: fade .18s ease-out; }
      .modal { width: min(500px, 100%); max-height: min(700px, calc(100vh - 40px)); overflow: auto; padding: 25px; color: var(--ink); background: var(--paper); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.26); }
      .modal-header { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
      .modal-header h2 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
      .modal-header p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
      .close-btn { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border: 0; color: var(--muted); background: var(--paper-2); border-radius: 10px; }
      .close-btn:hover { color: var(--hot); }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
      .field { display: grid; gap: 6px; }
      .field.full { grid-column: 1 / -1; }
      .field label { font-size: 13px; font-weight: 800; }
      .field input, .field select, .field textarea { width: 100%; min-height: 44px; padding: 10px 12px; color: var(--ink); background: #fffdf8; border: 1px solid rgba(16,24,33,.17); border-radius: 11px; }
      .field textarea { min-height: 78px; resize: vertical; }
      .field small { color: var(--muted); font-size: 11px; }
      .modal-footer { display: flex; justify-content: flex-end; gap: 9px; margin-top: 22px; }
      .secondary-btn { height: 44px; padding: 0 15px; color: var(--ink); background: var(--paper-2); border: 0; border-radius: 11px; font-weight: 750; }
      .secondary-btn:hover { background: #f0e2ca; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

      .detail-sheet { position: fixed; z-index: 30; right: 27px; bottom: 27px; width: min(370px, calc(100% - 54px)); display: none; padding: 19px; color: var(--ink); background: var(--paper); border-radius: 19px; box-shadow: var(--shadow); }
      .detail-sheet.open { display: block; animation: slideIn .22s ease-out; }
      .detail-head { display: flex; align-items: start; gap: 12px; }
      .detail-emoji { width: 57px; height: 57px; display: grid; place-items: center; flex: 0 0 auto; background: var(--paper-2); border-radius: 14px; font-size: 30px; }
      .detail-title { min-width: 0; flex: 1; }
      .detail-title h3 { margin: 0; font-size: 19px; line-height: 1.25; letter-spacing: -.04em; }
      .detail-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
      .detail-close { width: 28px; height: 28px; display: grid; place-items: center; border: 0; color: var(--muted); background: transparent; }
      .detail-rating { display: flex; align-items: center; gap: 7px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
      .detail-rating .stars { font-size: 17px; }
      .detail-rating strong { font-size: 19px; }
      .detail-rating span:last-child { color: var(--muted); font-size: 12px; }
      .detail-note { margin: 12px 0 15px; padding-left: 12px; border-left: 3px solid var(--sun); color: #536168; font-size: 13px; }
      .detail-actions { display: flex; gap: 8px; }
      .detail-actions button { flex: 1; height: 39px; border-radius: 10px; font-size: 13px; font-weight: 800; }
      .rate-btn { color: var(--paper); background: var(--ink); border: 0; }
      .rate-btn:hover { background: var(--ink-2); }
      .save-btn { color: var(--hot-dark); background: #fff0ea; border: 1px solid #ffd7cd; }
      .save-btn:hover { background: #ffe5de; }
      .rate-panel { display: none; align-items: center; gap: 7px; padding: 12px 0 0; }
      .rate-panel.open { display: flex; }
      .rate-panel button { width: 29px; height: 29px; padding: 0; color: #dd9423; background: transparent; border: 0; font-size: 24px; line-height: 1; }
      .rate-panel button:hover { transform: scale(1.18); }
      @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      .toast { position: fixed; z-index: 60; left: 50%; bottom: 24px; display: flex; align-items: center; gap: 9px; padding: 12px 16px; color: var(--paper); background: var(--ink); border-radius: 12px; box-shadow: 0 12px 30px rgba(16,24,33,.24); transform: translate(-50%, 100px); transition: transform .25s ease; font-size: 13px; }
      .toast.show { transform: translate(-50%, 0); }
      .toast-dot { width: 8px; height: 8px; background: #5ec586; border-radius: 50%; }
      .mobile-add { display: none; }

      @media (max-width: 900px) {
        .topbar { padding: 0 20px; gap: 15px; }
        .brand { min-width: auto; }
        .brand-text span { display: none; }
        .search-wrap { width: auto; flex: 1; }
        .workspace { grid-template-columns: 330px minmax(0, 1fr); }
        .sidebar-inner { padding: 22px 17px 28px; }
        .map-summary { max-width: 235px; }
        .map-summary h2 { font-size: 19px; }
        .map-summary p { font-size: 12px; }
      }
      @media (max-width: 700px) {
        .topbar { height: 66px; padding: 0 14px; }
        .brand-mark { width: 32px; height: 32px; }
        .brand-text strong { font-size: 15px; }
        .top-actions .icon-btn { display: none; }
        .top-actions .primary-btn { width: 40px; height: 40px; padding: 0; border-radius: 12px; box-shadow: 0 4px 0 var(--hot-dark); }
        .top-actions .primary-btn span { display: none; }
        .top-actions .primary-btn svg { width: 19px; height: 19px; }
        .top-actions { gap: 7px; }
        .workspace { display: flex; flex-direction: column; }
        .map-stage { order: 1; min-height: 58vh; height: 58vh; }
        .sidebar { order: 2; min-height: auto; border-right: 0; border-top: 1px solid var(--line); }
        .sidebar-inner { padding: 22px 15px 70px; }
        .sidebar h1 { font-size: 23px; }
        .sidebar-intro { margin-bottom: 15px; }
        .featured { display: none; }
        .map-summary { left: 17px; top: 17px; padding: 13px 15px; }
        .map-controls { right: 15px; top: 17px; }
        .map-legend { left: 15px; bottom: 15px; gap: 10px; padding: 8px 10px; font-size: 11px; }
        .detail-sheet { right: 15px; bottom: 15px; width: calc(100% - 30px); }
        .map-callout { width: 225px; }
        .mobile-add { display: flex; position: fixed; z-index: 25; right: 17px; bottom: 17px; width: 50px; height: 50px; padding: 0; box-shadow: 0 6px 0 var(--hot-dark), 0 10px 25px rgba(16,24,33,.22); border-radius: 16px; }
        .mobile-add span { display: none; }
      }
      @media (max-width: 420px) {

        { id: 2, name: '福州胡椒餅', type: '主食', emoji: '🥙', rating: 4.7, reviews: 241, distance: 0.4, price: '$50–60', note: '外皮酥脆、內餡胡椒香很足，出爐時最香。', color: '#edd4a8', live: true },
        { id: 3, name: '阿國滷味', type: '主食', emoji: '🍢', rating: 4.6, reviews: 98, distance: 0.3, price: '$70–150', note: '選料很多，辣油很香，適合買一盒邊走邊吃。', color: '#d7e7d6', live: true },
        { id: 4, name: '東發號蚵仔麵線', type: '主食', emoji: '🍜', rating: 4.5, reviews: 154, distance: 0.5, price: '$60–90', note: '蚵仔新鮮、麵線滑順，是很有老味道的一碗。', color: '#d9e4ed', live: true },
        { id: 5, name: '御品元冰火湯圓', type: '甜點', emoji: '🍡', rating: 4.7, reviews: 302, distance: 0.7, price: '$100–160', note: '熱湯圓配冰淇淋，口感很有反差，適合兩個人分著吃。', color: '#f3d6de', live: true },
        { id: 6, name: '彩虹粉圓冰', type: '飲品', emoji: '🥤', rating: 4.3, reviews: 76, distance: 0.6, price: '$50–80', note: '料多不甜膩，逛熱了來一碗剛剛好。', color: '#d7e0ed', live: true }
      ];
      let stalls = [...seedStalls];
      let activeFilter = 'all';
      let activeView = 'explore';
      let sortMode = 'open';
      let selectedId = null;
      let saved = new Set(JSON.parse(localStorage.getItem('nightmarket-saved') || '[]'));
      const $ = (id) => document.getElementById(id);
      const stallList = $('stallList');

      function stars(rating) {
        const full = Math.round(rating);
        return '★'.repeat(full) + '☆'.repeat(Math.max(0, 5 - full));
      }
      function visibleStalls() {
        const query = $('searchInput').value.trim().toLowerCase();
        return stalls.filter(stall => {
          const matchesFilter = activeFilter === 'all' || stall.type === activeFilter;
          const matchesView = activeView !== 'saved' || saved.has(stall.id);
          const haystack = `${stall.name}${stall.type}${stall.note}`.toLowerCase();
          return matchesFilter && matchesView && (!query || haystack.includes(query));
        }).sort((a, b) => sortMode === 'distance' ? a.distance - b.distance : sortMode === 'rating' ? b.rating - a.rating : Number(b.live) - Number(a.live));
      }
      function renderList() {
        const list = visibleStalls();
        $('resultCount').textContent = `${list.length} 個結果`;
        $('savedCount').textContent = saved.size;
        if (!list.length) {
          stallList.innerHTML = '<div class="empty-state"><strong>還沒有符合的攤位</strong><span>試試別的關鍵字，或先去推薦一攤。</span></div>';
          return;
        }
        stallList.innerHTML = list.map(stall => `
          <div class="stall-card ${selectedId === stall.id ? 'selected' : ''}" data-id="${stall.id}" role="button" tabindex="0" aria-label="查看 ${stall.name} 詳情">
            <div class="stall-thumb" style="--thumb:${stall.color}"><span>${stall.emoji}</span>${stall.live ? '<i class="live" title="營業中"></i>' : ''}</div>
            <div class="stall-meta"><span class="stall-name">${stall.name}</span><span class="stall-kind">${stall.type}・${stall.distance ? `${stall.distance.toFixed(1)} 公里` : '剛加入'}</span><div class="rating-row"><span class="stars">${stars(stall.rating)}</span><span class="rating-value">${stall.rating ? stall.rating.toFixed(1) : '尚無'}</span><span class="review-count">${stall.reviews ? `(${stall.reviews})` : ''}</span></div><div class="stall-bottom"><span class="status-pill ${stall.live ? '' : 'closed'}"><i></i>${stall.live ? '營業中' : '已打烊'}</span><span class="stall-price">${stall.price || '$—'}</span></div></div>
            <button class="bookmark ${saved.has(stall.id) ? 'saved' : ''}" data-save="${stall.id}" aria-label="${saved.has(stall.id) ? '取消收藏' : '收藏'} ${stall.name}">${saved.has(stall.id) ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5A2.5 2.5 0 0 1 8.5 1h7A2.5 2.5 0 0 1 18 3.5V22l-6-3.6L6 22V3.5Z"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5A2.5 2.5 0 0 1 8.5 1h7A2.5 2.5 0 0 1 18 3.5V22l-6-3.6L6 22V3.5Z"/></svg>'}</button>
          </div>`).join('');
        stallList.querySelectorAll('.stall-card').forEach(card => {
          card.addEventListener('click', (e) => { if (!e.target.closest('.bookmark')) openDetail(Number(card.dataset.id)); });
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(Number(card.dataset.id)); } });
        });
        stallList.querySelectorAll('[data-save]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); toggleSave(Number(btn.dataset.save)); }));
      }
      function openDetail(id) {
        const stall = stalls.find(item => item.id === id);
        if (!stall) return;
        selectedId = id;
        $('detailEmoji').textContent = stall.emoji;
        $('detailName').textContent = stall.name;
        $('detailType').textContent = `${stall.type}・步行 ${id === 1 ? 2 : id === 2 ? 3 : 4} 分鐘`;
        $('detailScore').textContent = stall.rating.toFixed(1);
        $('detailReviews').textContent = `${stall.reviews} 則評分`;
        $('detailNote').textContent = stall.note;
        $('saveBtn').textContent = saved.has(id) ? '♥ 已收藏' : '♡ 收藏';
        $('detailSheet').classList.add('open');
        $('ratePanel').classList.remove('open');
        document.querySelectorAll('.map-pin').forEach(pin => pin.classList.toggle('active', Number(pin.dataset.id) === id));
        const pin = document.querySelector(`.map-pin[data-id="${id}"]`);
        const callout = $('mapCallout');
        if (pin) {
          const mapRect = $('mapCanvas').getBoundingClientRect();
          const pinRect = pin.getBoundingClientRect();
          callout.style.left = `${pinRect.left - mapRect.left + pinRect.width / 2}px`;
          callout.style.top = `${pinRect.top - mapRect.top + 3}px`;
          $('calloutEmoji').textContent = stall.emoji;
          $('calloutName').textContent = stall.name;
          $('calloutInfo').textContent = `${stall.rating.toFixed(1)} ★ ・ ${stall.reviews} 則評分`;
          callout.classList.add('show');
        } else {
          callout.classList.remove('show');
        }
        renderList();
      }
      function closeDetail() { selectedId = null; $('detailSheet').classList.remove('open'); $('mapCallout').classList.remove('show'); document.querySelectorAll('.map-pin').forEach(pin => pin.classList.remove('active')); renderList(); }
      function toggleSave(id) {
        if (saved.has(id)) { saved.delete(id); showToast('已從收藏移除'); } else { saved.add(id); showToast('已收藏這一攤'); }
        localStorage.setItem('nightmarket-saved', JSON.stringify([...saved]));
        if (selectedId === id) $('saveBtn').textContent = saved.has(id) ? '♥ 已收藏' : '♡ 收藏';
        renderList();
      }
      function showToast(message) { $('toastText').textContent = message; $('toast').classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2400); }
      function openModal() { $('recommendModal').classList.add('open'); setTimeout(() => $('stallName').focus(), 40); }
      function closeModal() { $('recommendModal').classList.remove('open'); $('recommendForm').reset(); }

      $('searchInput').addEventListener('input', renderList);
      document.querySelectorAll('.quick-filter').forEach(filter => filter.addEventListener('click', () => { sortMode = filter.dataset.sort; document.querySelectorAll('.quick-filter').forEach(item => item.classList.toggle('active', item === filter)); renderList(); }));
      document.querySelectorAll('.filter-chip').forEach(chip => chip.addEventListener('click', () => { activeFilter = chip.dataset.filter; document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip)); renderList(); }));
      document.querySelectorAll('[data-view]').forEach(tab => tab.addEventListener('click', () => { activeView = tab.dataset.view; document.querySelectorAll('[data-view]').forEach(t => { const isActive = t === tab; t.classList.toggle('active', isActive); t.setAttribute('aria-selected', isActive); }); renderList(); }));
      document.querySelectorAll('.map-pin').forEach(pin => pin.addEventListener('click', () => openDetail(Number(pin.dataset.id))));
      $('detailClose').addEventListener('click', closeDetail); $('calloutClose').addEventListener('click', () => $('mapCallout').classList.remove('show'));
      $('saveBtn').addEventListener('click', () => { if (selectedId) toggleSave(selectedId); });
      $('rateBtn').addEventListener('click', () => $('ratePanel').classList.toggle('open'));
      $('ratePanel').querySelectorAll('[data-score]').forEach(btn => btn.addEventListener('click', () => {
        const score = Number(btn.dataset.score); const stall = stalls.find(item => item.id === selectedId); if (!stall) return;
        const newRating = ((stall.rating * stall.reviews) + score) / (stall.reviews + 1); stall.rating = Math.round(newRating * 10) / 10; stall.reviews += 1; openDetail(stall.id); showToast(`謝謝你的 ${score} 星評分！`);
      }));
      $('openRecommend').addEventListener('click', openModal); $('mobileRecommend').addEventListener('click', openModal); $('modalClose').addEventListener('click', closeModal); $('modalCancel').addEventListener('click', closeModal);
      $('recommendModal').addEventListener('click', e => { if (e.target === $('recommendModal')) closeModal(); });
      $('recommendForm').addEventListener('submit', e => {
        e.preventDefault(); const form = new FormData(e.currentTarget); const nextId = Math.max(...stalls.map(s => s.id)) + 1;
        const newStall = { id: nextId, name: form.get('stallName').trim(), type: form.get('stallType'), emoji: form.get('stallEmoji'), rating: 0, reviews: 0, distance: 0.1, price: '$—', note: form.get('stallNote').trim() || '剛加入地圖，等你來留下第一則評分。', color: '#f2dfbd', live: true };
        stalls = [newStall, ...stalls]; closeModal(); activeView = 'explore'; document.querySelectorAll('[data-view]').forEach(t => { t.classList.toggle('active', t.dataset.view === 'explore'); t.setAttribute('aria-selected', t.dataset.view === 'explore'); }); renderList(); openDetail(nextId); showToast('推薦已加入地圖，謝謝你！');
      });
      $('locateBtn').addEventListener('click', () => { const locationDot = document.querySelector('.user-location'); if (locationDot) { locationDot.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 460 }); } showToast('已定位到你目前的位置'); });
      $('marketSelect').addEventListener('click', () => showToast('目前先從饒河街開始，之後可以切換其他夜市。'));
      $('helpBtn').addEventListener('click', () => showToast('點地圖上的圖釘，就能查看攤位詳情與評分。'));
      $('profileBtn').addEventListener('click', () => showToast('你的收藏會保存在這台裝置上。'));
      $('routeBtn').addEventListener('click', () => { $('searchInput').value = ''; activeFilter = 'all'; document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === 'all')); showToast('已為你準備今晚的 3 攤路線'); renderList(); openDetail(1); });
      $('zoomIn').addEventListener('click', () => { $('mapCanvas').style.transform = 'scale(1.08)'; showToast('地圖已放大'); });
      $('zoomOut').addEventListener('click', () => { $('mapCanvas').style.transform = 'scale(1)'; showToast('地圖已縮回原比例'); });
      function registerWebMCP() {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const lifecycle = new AbortController();
        const register = (tool) => Promise.resolve(context.registerTool(tool, { signal: lifecycle.signal })).catch(() => undefined);
        register({
          name: 'search_stalls', title: '搜尋夜市攤位',
          description: '搜尋目前夜市地圖中的攤位；只讀取資料，不會修改收藏或評分。',
          inputSchema: { type: 'object', properties: { query: { type: 'string' }, category: { type: 'string' } }, additionalProperties: false },
          annotations: { readOnlyHint: true, untrustedContentHint: true },
          execute(input) {
            const query = typeof input?.query === 'string' ? input.query.trim().toLowerCase() : '';
            const category = typeof input?.category === 'string' ? input.category : 'all';
            return stalls.filter(stall => (category === 'all' || stall.type === category) && (!query || `${stall.name}${stall.type}${stall.note}`.toLowerCase().includes(query))).map(stall => ({ id: stall.id, name: stall.name, category: stall.type, rating: stall.rating, reviews: stall.reviews }));
          }
        });
        register({
          name: 'save_stall', title: '收藏夜市攤位',
          description: '把指定攤位加入目前裝置的收藏清單。',
          inputSchema: { type: 'object', properties: { stallId: { type: 'number' } }, required: ['stallId'], additionalProperties: false },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute(input) {
            const id = Number(input?.stallId); const stall = stalls.find(item => item.id === id);
            if (!stall) throw new Error('找不到這個攤位');
            saved.add(id); localStorage.setItem('nightmarket-saved', JSON.stringify([...saved])); renderList(); if (selectedId === id) $('saveBtn').textContent = '♥ 已收藏';
            return { id, name: stall.name, saved: true };
          }
        });
        register({
          name: 'rate_stall', title: '為夜市攤位評分',
          description: '為指定攤位送出 1 到 5 顆星，並更新畫面上的平均分數。',
          inputSchema: { type: 'object', properties: { stallId: { type: 'number' }, score: { type: 'number', minimum: 1, maximum: 5 } }, required: ['stallId', 'score'], additionalProperties: false },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute(input) {
            const id = Number(input?.stallId); const score = Number(input?.score); const stall = stalls.find(item => item.id === id);
            if (!stall || !Number.isInteger(score) || score < 1 || score > 5) throw new Error('攤位不存在或評分必須是 1 到 5 的整數');
            stall.rating = Math.round((((stall.rating * stall.reviews) + score) / (stall.reviews + 1)) * 10) / 10; stall.reviews += 1; renderList(); if (selectedId === id) openDetail(id);
            return { id, name: stall.name, rating: stall.rating, reviews: stall.reviews };
          }
        });
      }
      registerWebMCP();
      renderList();
    </script>
  </body>
</html>
